<!DOCTYPE html>
<html>
<head>
    <title>Coding Quote</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+Pro:ital,wght@0,400;0,700;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,700&display=swap');

        .bg-container {
            background-image: url("https://res.cloudinary.com/djhuqjvrl/image/upload/v1764868270/codingbg_bagxgp.png");
            background-size: cover;
            height: 100vh;
        }

        .card-style {
            color: white;
            text-align: left;
            background-color: #00000080;
            font-family: "Bree Serif";
            border-color: #48ee59;
            font-size: 34px;
            margin: 135px;
            border-width: 5px;
            border-style: solid;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="bg-container d-flex flex-column justify-content-center">
        <button class="card-style">
            <p>Code is more than some bytes in a file</p>
        </button>
    </div>
</body>
</html>
