<!DOCTYPE html>
<html>
<head>
    <title>News Page</title>

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <style>
    @import url('https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+Pro:ital,wght@0,400;0,700;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,700&display=swap');

    .news-bg-container {
        background-image: url("https://res.cloudinary.com/dkfyxoeem/image/upload/v1765966057/news_yksfmj.jpg");
        background-size: cover;
        height: 100vh;
    }

    .news-card-item {
        background-color: white;
        font-family: "Roboto";
        border-top-left-radius: 10px;
        border-top-right-radius: 10px;
        padding: 15px;
    }

    .news-para {
        font-size: 13px;
        color: #323f4b;
    }

    .news-heading {
        font-size: 20px;
    }

    .news-btn {
        padding: 8px;
        margin: 5px;
        border-radius: 5px;
    }

    </style>

</head>

<body>

<div class="news-bg-container d-flex flex-column justify-content-end">

    <div class="news-card-item">

        <p class="news-para">
            NEWS OF THE DAY
        </p>

        <p class="news-heading">
            All educational institutions in Assam to reopen from November 2
        </p>

        <p class="news-para">
            Uttar Pradesh's Gautam Buddh Nagar recorded 107 new Covid-19 cases on Saturday, pushing the district's infection tally to 15,803, official data showed.
        </p>

        <button class="news-btn btn-dark">
            Read More
        </button>

        <button class="news-btn btn-primary">
            Back
        </button>

    </div>

</div>

</body>
</html>
