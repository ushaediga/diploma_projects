<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Munch</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css">

<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js"></script>

<script src="https://kit.fontawesome.com/667a36db86.js"></script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap');

body{
    font-family: "Roboto", sans-serif;
}

.main-heading{
    text-align:center;
}

.color-box{
    padding:20px;
    margin-bottom:10px;
}

.color-name{
    color:white;
    font-size:20px;
    text-align:center;
}

/* Food Munch custom styles */

.food-munch-logo{
    width:80px;
    height:70px;
}

.custom-banner-bg-image{
    background-image:url("https://images.unsplash.com/photo-1504674900247-0877df9cc836");
    background-size:cover;
    height:100vh;
}

.custom-banner-head{
    color:white;
    font-size:45px;
    font-weight:bold;
}

.custom-banner-caption{
    color:white;
    font-size:24px;
}

.custom-banner-button{
    background-color:#d0b200;
    color:white;
    border:none;
    padding:10px 20px;
    border-radius:8px;
}

.custom-banner-button2{
    background-color:transparent;
    color:#d0b200;
    border:2px solid #d0b200;
    padding:10px 20px;
    border-radius:8px;
}

.wcu-card{
    border-radius:10px;
    text-align:center;
    border:1px solid #e5eaf4;
}

.wcu-card-image{
    width:90px;
}

.menu-item-card{
    border-radius:16px;
}

.menu-item-image{
    border-radius:16px;
}

.follow-us-icon-container{
    background-color:#faf7e8;
    width:70px;
    height:70px;
    margin:15px;
    padding:22px;
    border-radius:40px;
}

.icon{
    font-size:25px;
}

.footer{
    background-color:#0d2436;
}

.footer-text{
    color:#959ead;
}
</style>

</head>

<body>

<h1 class="main-heading mt-5">
Food Munch Website
</h1>

<div class="custom-banner-bg-image d-flex flex-column justify-content-center">
    <div class="text-center">
        <h1 class="custom-banner-head">
            Get Delicious Food Anytime
        </h1>

        <p class="custom-banner-caption">
            Eat Smart & Healthy
        </p>

        <button class="custom-banner-button">
            View Menu
        </button>

        <button class="custom-banner-button2">
            Order Now
        </button>
    </div>
</div>

</body>
</html>
