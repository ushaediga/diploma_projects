<!DOCTYPE html>
<html>
<head>
  <title>Diwali Celebration</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bree+Serif&family=Caveat:wght@400;700&family=Lobster&family=Monoton&family=Open+Sans:ital,wght@0,400;0,700;1,400;1,700&family=Playfair+Display+SC:ital,wght@0,400;0,700;1,700&family=Playfair+Display:ital,wght@0,400;0,700;1,700&family=Roboto:ital,wght@0,400;0,700;1,400;1,700&family=Source+Sans+Pro:ital,wght@0,400;0,700;1,700&family=Work+Sans:ital,wght@0,400;0,700;1,700&display=swap');

    .diwali-top-section {
      background-image: url("https://media.istockphoto.com/id/588223710/photo/diwali-oil-lamp.jpg?s=612x612&w=0&k=20&c=Mwl1S6C-CemmHoDPx4kwE8XKNcRRlZLRmKkpdfkM4VU=");
      background-size: cover;
      height: 42vh;
    }

    .diwali-heading {
      color: white;
      font-family: "Caveat";
      width: 5px;
      font-size: 35px;
      padding: 20px;
    }

    .diwali-bottom-section {
      background-color: #fae6ff;
      padding: 5px;
      text-align: center;
    }

    .diwali-card-item {
      background-color: white;
      height: 170px;
      width: 130px;
      padding: 5px;
      border-radius: 15px;
      margin: 20px;
      text-align: center;
    }

    .diwali-card-image {
      height: 100px;
      width: 110px;
      border-radius: 20px;
      padding: 5px;
    }

    .diwali-card-heading {
      font-size: 15px;
      color: red;
    }

    .diwali-card-rupee {
      font-size: 15px;
      font-weight: bold;
      color: green;
    }

    .diwali-btn {
      border-width: 0px;
      border-radius: 5px;
      padding: 5px;
    }

  </style>
</head>

<body>

  <div class="diwali-top-section">
    <h1 class="diwali-heading">
      Celebrating diwali with friends
    </h1>
  </div>

  <div class="diwali-bottom-section">

    <div class="row1 d-flex flex-row justify-content-center">

      <div class="diwali-card-item">
        <img src="https://images.unsplash.com/photo-1700788629800-ad3a0b202054?w=600&auto=format&fit=crop&q=60" class="diwali-card-image">
        <h1 class="diwali-card-heading">Diwali-lamp</h1>
        <p class="diwali-card-rupee">Rs 60/-</p>
      </div>

      <div class="diwali-card-item">
        <img src="https://media.istockphoto.com/id/2237983385/photo/glowing-lanterns-floating-in-the-night-sky.jpg?s=1024x1024&w=is&k=20&c=YX_rfK71ltQ0ntXcQe8WB7h6DAgIGMb2AXmGkAJqx08=" class="diwali-card-image">
        <h1 class="diwali-card-heading">Diwali-air ballon</h1>
        <p class="diwali-card-rupee">Rs 110/-</p>
      </div>

    </div>

    <div class="row2 d-flex flex-row justify-content-center">

      <div class="diwali-card-item">
        <img src="https://images.unsplash.com/photo-1586410753944-1405d94a256a?w=600&auto=format&fit=crop&q=60" class="diwali-card-image">
        <h1 class="diwali-card-heading">Diwali-sparkles</h1>
        <p class="diwali-card-rupee">Rs 200/-</p>
      </div>

      <div class="diwali-card-item">
        <img src="https://www.shutterstock.com/shutterstock/videos/2983000/thumb/8.jpg?ip=x480" class="diwali-card-image">
        <h1 class="diwali-card-heading">Diwali-Fire crackers</h1>
        <p class="diwali-card-rupee">Rs 100/-</p>
      </div>

    </div>

    <button class="diwali-btn btn-primary">
      View More
    </button>

  </div>

</body>
</html>
